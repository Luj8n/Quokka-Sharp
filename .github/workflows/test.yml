name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Install all solvers
        run: ./scripts/setup-solvers.sh

      - name: Run tests
        run: |
          export PATH="$PWD/.solvers/bin:$PATH"
          uv run --no-sync pytest tests/
